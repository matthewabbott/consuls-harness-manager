[package]
name = "chm-daemon"
description = "Consuls server: a headless chm-core that serves the phone's web app and pushes to it"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "consuls-server"
path = "src/main.rs"

[dependencies]
chm-core = { path = "../chm-core" }
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

# Web Push (RFC 8291 / 8292) on the RustCrypto crates russh already brings in.
p256 = { version = "0.14", default-features = false, features = ["std", "ecdh", "ecdsa", "getrandom"] }
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"

# HTTP: the API behind `tailscale serve`, and the client to push services. TLS through rustls
# with ring only (no aws-lc, no openssl), which keeps cross-compiling simple.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
http = "1"
bytes = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
