[package]
name = "consuls"
description = "Consuls Harness Manager — dashboard for coding agents in tmux across your tailnet"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "consuls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chm-core = { path = "../crates/chm-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Desktop only: the iPhone app has one window, no tray, and no chimes (it's only running while
# it's on screen).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

# Notification Center (UNUserNotificationCenter), with a click handler.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError", "NSObject"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
